name: core-ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: test -z "$(gofmt -l reconcile/*.go)"
        shell: bash
        if: matrix.os != 'windows-latest'
      - run: go vet ./...
      - run: go test ./...
